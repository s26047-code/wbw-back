name: CI

# PR을 올리거나 main에 푸시하면 테스트를 실행한다. (develop 푸시는 CD 워크플로가 테스트 + 배포)
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트 실행
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: 테스트 보고서 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: Discord 알림
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          case "${{ job.status }}" in
            success) T="테스트 통과" ;;
            failure) T="테스트 실패" ;;
            *)       T="테스트 취소" ;;
          esac
          bash .github/scripts/discord-notify.sh "${{ job.status }}" "$T"
